name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:       # lets you trigger it manually from the GitHub UI

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r windows/requirements.txt

      - name: Copy sprites into windows folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows\Sprites | Out-Null
          Copy-Item -Recurse -Force Resources\Sprites\* windows\Sprites\

      - name: Smoke-test the behavior core
        shell: pwsh
        run: |
          Set-Location windows
          python tests/smoke_core.py

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          Set-Location windows
          pyinstaller build.spec
          pyinstaller build_debug.spec

      - name: Upload main EXE
        uses: actions/upload-artifact@v4
        with:
          name: Xubair
          path: windows/dist/Xubair.exe
          if-no-files-found: error

      - name: Upload debug EXE
        uses: actions/upload-artifact@v4
        with:
          name: Xubair-debug
          path: windows/dist/Xubair-debug.exe
          if-no-files-found: error
